<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Platform ERD</title>
  <link rel="stylesheet" href="erd-colours.css">
  <style>
    body { font-family: Arial, sans-serif; padding: 32px; background: #fff; }
    h1   { font-size: 20px; color: #1a1a1a; margin-bottom: 4px; }
    p    { font-size: 13px; color: #666; margin-bottom: 24px; }
  </style>
</head>
<body>
  <h1>Platform Entity Relationship Diagram</h1>
  <p>Core · Angels Circle · Mentors Circle · Startup & Alumni · Data Room · Application Pipeline</p>
  <div class="mermaid"></div>

  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({ startOnLoad: false, theme: 'base' });
    fetch('ERD_Diagram.mmd')
      .then(r => r.text())
      .then(async definition => {
        const { svg } = await mermaid.render('erd', definition);
        document.querySelector('.mermaid').innerHTML = svg;
      });
  </script>
</body>
</html>
